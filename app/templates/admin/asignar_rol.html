{% extends "base.html" %}
{% block title %}Asignar Rol{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5">
    <div class="wii-card p-4">
      <h4 class="wii-page-title mb-1"><i class="bi bi-person-gear"></i> Asignar Rol</h4>
      <p class="text-muted mb-4" style="font-weight:700;font-size:0.88rem;">
        Cambia el rol de <strong>{{ usuario.nombre_completo }}</strong>.
      </p>

      <form method="POST" action="{{ url_for('admin.asignar_rol', usuario_id=usuario.id) }}">
        <div class="mb-4 d-flex flex-column gap-2">
          {% for r in roles %}
          <label class="d-flex align-items-center gap-3 p-3 rounded-4"
                 style="background:rgba(200,232,255,0.4);border:2px solid {% if usuario.rol == r %}#3a8de0{% else %}#c8e0f8{% endif %};cursor:pointer;transition:border 0.15s;">
            <input type="radio" name="rol" value="{{ r }}" {{ 'checked' if usuario.rol == r }} />
            <span style="font-weight:800;font-size:0.95rem;">
              {% if r == 'administrador' %}🛡️{% elif r == 'profesor' %}👩‍🏫{% else %}🎓{% endif %}
              {{ r|capitalize }}
            </span>
          </label>
          {% endfor %}
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-wii">
            <i class="bi bi-check-lg me-1"></i>Guardar cambio
          </button>
          <a href="{{ url_for('admin.gestionar_usuarios') }}" class="btn btn-wii-outline">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
