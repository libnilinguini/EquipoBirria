{% extends "base.html" %}
{% block title %}Registrarse{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-7 col-lg-6">
    <div class="wii-card p-4">
      <h4 class="wii-page-title mb-1"><i class="bi bi-person-plus-fill"></i> Crear cuenta</h4>
      <p class="text-muted mb-4" style="font-weight:700;font-size:0.88rem;">Completa el formulario para registrarte en el SGCI.</p>

      <form method="POST" action="{{ url_for('auth.register') }}">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="wii-label">Nombre</label>
            <input type="text" name="nombre" class="form-control wii-input"
                   value="{{ form_data.get('nombre', '') }}" required />
          </div>
          <div class="col-md-6">
            <label class="wii-label">Apellido</label>
            <input type="text" name="apellido" class="form-control wii-input"
                   value="{{ form_data.get('apellido', '') }}" required />
          </div>
          <div class="col-12">
            <label class="wii-label">Correo electrónico</label>
            <input type="email" name="email" class="form-control wii-input"
                   value="{{ form_data.get('email', '') }}" placeholder="tu@correo.com" required />
          </div>
          <div class="col-md-6">
            <label class="wii-label">Contraseña</label>
            <input type="password" name="password" class="form-control wii-input"
                   placeholder="Mínimo 8 caracteres" required />
          </div>
          <div class="col-md-6">
            <label class="wii-label">Confirmar contraseña</label>
            <input type="password" name="confirmar_password" class="form-control wii-input" required />
          </div>

          <div class="col-12">
            <label class="wii-label mb-2">Tipo de usuario</label>
            <div class="d-flex gap-3">
              <label class="d-flex align-items-center gap-2 p-3 rounded-4 cursor-pointer"
                     style="background:rgba(200,232,255,0.4);border:2px solid #c8e0f8;flex:1;cursor:pointer;">
                <input type="radio" name="rol" value="alumno"
                       {{ 'checked' if form_data.get('rol','alumno') == 'alumno' }} />
                <span style="font-weight:800;"><i class="bi bi-mortarboard me-1 text-wii"></i>Alumno</span>
              </label>
              <label class="d-flex align-items-center gap-2 p-3 rounded-4"
                     style="background:rgba(200,232,255,0.4);border:2px solid #c8e0f8;flex:1;cursor:pointer;">
                <input type="radio" name="rol" value="profesor"
                       {{ 'checked' if form_data.get('rol') == 'profesor' }} />
                <span style="font-weight:800;"><i class="bi bi-person-workspace me-1 text-wii"></i>Profesor</span>
              </label>
            </div>
          </div>
        </div>

        <div class="d-grid mt-4">
          <button type="submit" class="btn btn-wii">
            <i class="bi bi-check-circle me-2"></i>Registrarse
          </button>
        </div>
      </form>

      <hr class="wii-divider mt-4" />
      <p class="text-center mb-0" style="font-size:0.9rem;font-weight:700;">
        ¿Ya tienes cuenta?
        <a href="{{ url_for('auth.login') }}" class="fw-800 text-wii">Inicia sesión</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
