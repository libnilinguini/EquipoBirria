{% extends "base.html" %}
{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5 col-lg-4">

    <div class="text-center mb-4">
      <div style="width:72px;height:72px;background:linear-gradient(135deg,#3a8de0,#1a6bbf);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(26,107,191,0.4);">
        <i class="bi bi-translate text-white" style="font-size:2rem;"></i>
      </div>
      <h2 class="wii-page-title mt-3 mb-0">SGCI</h2>
      <p class="text-muted" style="font-weight:700;font-size:0.9rem;">Sistema de Gestión de Cursos de Idiomas</p>
    </div>

    <div class="wii-card p-4">
      <h5 class="fw-900 mb-4 text-center text-wii-dark" style="font-weight:800;">¡Bienvenido de vuelta!</h5>

      <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="mb-3">
          <label class="wii-label">Correo electrónico</label>
          <div class="input-group">
            <span class="input-group-text" style="border-radius:14px 0 0 14px;border:2px solid #c8e0f8;border-right:none;background:rgba(255,255,255,0.85);">
              <i class="bi bi-envelope text-wii"></i>
            </span>
            <input type="email" name="email" class="form-control wii-input"
                   style="border-radius:0 14px 14px 0;border-left:none;"
                   placeholder="tu@correo.com" required autofocus />
          </div>
        </div>

        <div class="mb-3">
          <label class="wii-label">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text" style="border-radius:14px 0 0 14px;border:2px solid #c8e0f8;border-right:none;background:rgba(255,255,255,0.85);">
              <i class="bi bi-lock text-wii"></i>
            </span>
            <input type="password" name="password" class="form-control wii-input"
                   style="border-radius:0 14px 14px 0;border-left:none;"
                   placeholder="••••••••" required />
          </div>
        </div>

        <div class="mb-4 d-flex align-items-center gap-2">
          <input type="checkbox" class="form-check-input" id="recordar" name="recordar" style="border-radius:6px;border:2px solid #c8e0f8;width:1.1rem;height:1.1rem;" />
          <label class="form-check-label" for="recordar" style="font-weight:700;font-size:0.87rem;">Recordar sesión</label>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-wii">
            <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesión
          </button>
        </div>
      </form>

      <hr class="wii-divider mt-4" />
      <p class="text-center mb-0" style="font-size:0.9rem;font-weight:700;">
        ¿No tienes cuenta?
        <a href="{{ url_for('auth.register') }}" class="fw-800 text-wii">Regístrate aquí</a>
      </p>
    </div>

  </div>
</div>
{% endblock %}
