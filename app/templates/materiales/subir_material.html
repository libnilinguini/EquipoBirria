{% extends "base.html" %}
{% block title %}Subir Material{% endblock %}
{% block content %}
<div class="row justify-content-center mt-3">
  <div class="col-md-6">
    <div class="wii-card p-4">
      <h4 class="wii-page-title mb-1"><i class="bi bi-cloud-arrow-up-fill"></i> Subir Material</h4>
      <p class="text-muted mb-4" style="font-weight:700;font-size:0.88rem;">
        Curso: <strong>{{ curso.titulo }}</strong>
      </p>

      <form method="POST"
            action="{{ url_for('materiales.subir_material', curso_id=curso.id) }}"
            enctype="multipart/form-data">

        <div class="mb-3">
          <label class="wii-label">Título del material <span class="text-danger">*</span></label>
          <input type="text" name="titulo" class="form-control wii-input"
                 placeholder="Ej. Unidad 1 — Presentaciones" required />
        </div>

        <div class="mb-3">
          <label class="wii-label">Descripción</label>
          <textarea name="descripcion" class="form-control wii-input" rows="2"
                    placeholder="Breve descripción…"></textarea>
        </div>

        <div class="mb-3">
          <label class="wii-label">Archivo <span class="text-danger">*</span></label>
          <input type="file" name="archivo" class="form-control wii-input" required
                 accept=".pdf,.docx,.pptx,.mp4,.png,.jpg,.jpeg" />
          <div class="form-text mt-1" style="font-weight:700;font-size:0.8rem;color:#4a6080;">
            PDF, DOCX, PPTX, MP4, PNG, JPG · Máx. 16 MB
          </div>
        </div>

        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-wii">
            <i class="bi bi-upload me-1"></i>Subir archivo
          </button>
          <a href="{{ url_for('materiales.gestionar_materiales', curso_id=curso.id) }}"
             class="btn btn-wii-outline">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
