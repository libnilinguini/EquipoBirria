{% extends "base.html" %}
{% block title %}Subir Material{% endblock %}

{% block content %}
<div class="row justify-content-center mt-3">
  <div class="col-md-6">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <h4 class="fw-bold mb-1">
          <i class="bi bi-cloud-arrow-up me-2 text-primary"></i>Subir Material
        </h4>
        <p class="text-muted small mb-4">
          Curso: <strong>{{ curso.titulo }}</strong>
        </p>

        <form method="POST"
              action="{{ url_for('materiales.subir_material', curso_id=curso.id) }}"
              enctype="multipart/form-data">

          <div class="mb-3">
            <label for="titulo" class="form-label fw-semibold">
              Título del material <span class="text-danger">*</span>
            </label>
            <input type="text" id="titulo" name="titulo" class="form-control"
                   placeholder="Ej. Unidad 1 - Presentaciones" required />
          </div>

          <div class="mb-3">
            <label for="descripcion" class="form-label fw-semibold">Descripción</label>
            <textarea id="descripcion" name="descripcion" class="form-control" rows="2"
                      placeholder="Breve descripción del material…"></textarea>
          </div>

          <div class="mb-3">
            <label for="archivo" class="form-label fw-semibold">
              Archivo <span class="text-danger">*</span>
            </label>
            <input type="file" id="archivo" name="archivo" class="form-control" required
                   accept=".pdf,.docx,.pptx,.mp4,.png,.jpg,.jpeg" />
            <div class="form-text">
              Formatos permitidos: PDF, DOCX, PPTX, MP4, PNG, JPG · Máximo 16 MB
            </div>
          </div>

          <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-upload me-1"></i>Subir archivo
            </button>
            <a href="{{ url_for('materiales.gestionar_materiales', curso_id=curso.id) }}"
               class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
