{% extends "base.html" %}
{% block title %}Editar Curso{% endblock %}

{% block content %}
<div class="row justify-content-center mt-3">
  <div class="col-md-7">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <h4 class="fw-bold mb-1"><i class="bi bi-pencil-square me-2 text-primary"></i>Editar Curso</h4>
        <p class="text-muted small mb-4">Modifica los datos del curso <strong>{{ curso.titulo }}</strong>.</p>

        <form method="POST" action="{{ url_for('cursos.editar_curso', curso_id=curso.id) }}">
          <div class="row g-3">
            <div class="col-12">
              <label for="titulo" class="form-label fw-semibold">Título <span class="text-danger">*</span></label>
              <input type="text" id="titulo" name="titulo" class="form-control"
                     value="{{ curso.titulo }}" required />
            </div>

            <div class="col-md-6">
              <label for="idioma" class="form-label fw-semibold">Idioma <span class="text-danger">*</span></label>
              <input type="text" id="idioma" name="idioma" class="form-control"
                     value="{{ curso.idioma }}" required />
            </div>

            <div class="col-md-6">
              <label for="nivel" class="form-label fw-semibold">Nivel <span class="text-danger">*</span></label>
              <select id="nivel" name="nivel" class="form-select" required>
                {% for n in ['A1','A2','B1','B2','C1','C2'] %}
                <option value="{{ n }}" {{ 'selected' if curso.nivel == n }}>{{ n }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-12">
              <label for="descripcion" class="form-label fw-semibold">Descripción</label>
              <textarea id="descripcion" name="descripcion" class="form-control" rows="3">{{ curso.descripcion or '' }}</textarea>
            </div>

            <div class="col-md-6">
              <label for="cupo_maximo" class="form-label fw-semibold">Cupo máximo</label>
              <input type="number" id="cupo_maximo" name="cupo_maximo" class="form-control"
                     min="1" value="{{ curso.cupo_maximo or '' }}" />
            </div>
          </div>

          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-floppy me-1"></i>Guardar cambios
            </button>
            <a href="{{ url_for('cursos.listar_cursos') }}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
