{% extends "base.html" %}
{% block title %}Asignar Rol{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h4 class="fw-bold mb-1"><i class="bi bi-person-gear me-2 text-primary"></i>Asignar Rol</h4>
        <p class="text-muted small mb-4">
          Cambia el rol de acceso para <strong>{{ usuario.nombre_completo }}</strong>.
        </p>

        <form method="POST" action="{{ url_for('admin.asignar_rol', usuario_id=usuario.id) }}">
          <div class="mb-4">
            <label class="form-label fw-semibold">Selecciona el nuevo rol</label>
            {% for r in roles %}
            <div class="form-check border rounded p-3 mb-2">
              <input class="form-check-input" type="radio" name="rol"
                     id="rol_{{ r }}" value="{{ r }}"
                     {{ 'checked' if usuario.rol == r }} />
              <label class="form-check-label w-100" for="rol_{{ r }}">
                {% if r == 'administrador' %}
                  <i class="bi bi-shield-lock me-2 text-danger"></i>
                {% elif r == 'profesor' %}
                  <i class="bi bi-person-workspace me-2 text-info"></i>
                {% else %}
                  <i class="bi bi-mortarboard me-2 text-secondary"></i>
                {% endif %}
                <strong>{{ r|capitalize }}</strong>
              </label>
            </div>
            {% endfor %}
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-lg me-1"></i>Guardar cambio
            </button>
            <a href="{{ url_for('admin.gestionar_usuarios') }}" class="btn btn-outline-secondary">
              Cancelar
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
