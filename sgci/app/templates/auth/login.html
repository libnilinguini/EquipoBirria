{% extends "base.html" %}
{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h4 class="card-title text-center mb-1 fw-bold">
          <i class="bi bi-translate me-2 text-primary"></i>SGCI
        </h4>
        <p class="text-center text-muted small mb-4">Sistema de Gestión de Cursos de Idiomas</p>

        <form method="POST" action="{{ url_for('auth.login') }}">
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Correo electrónico</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" id="email" name="email" class="form-control"
                     placeholder="tu@correo.com" required autofocus />
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label fw-semibold">Contraseña</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" id="password" name="password" class="form-control"
                     placeholder="••••••••" required />
            </div>
          </div>

          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="recordar" name="recordar" />
            <label class="form-check-label" for="recordar">Recordar sesión</label>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesión
            </button>
          </div>
        </form>

        <hr />
        <p class="text-center mb-0 small">
          ¿No tienes cuenta?
          <a href="{{ url_for('auth.register') }}" class="fw-semibold">Regístrate aquí</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
